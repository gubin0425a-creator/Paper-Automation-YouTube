name: AutoTube AI Generator

on:
  workflow_dispatch:
    inputs:
      videoType:
        description: '영상 타입'
        required: true
        default: 'shorts'
      strategy:
        description: '채널 전략'
        required: false
        default: ''
      youtubeKey:
        description: 'YouTube API Key'
        required: false
        default: ''
      aiModel:
        description: 'AI Model'
        required: true
        default: 'gpt'
      aiKey:
        description: 'AI API Key'
        required: false
        default: ''

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Video Generation & Upload
      run: python main.py
      env:
        VIDEO_TYPE: ${{ github.event.inputs.videoType }}
        STRATEGY: ${{ github.event.inputs.strategy }}
        YOUTUBE_KEY: ${{ github.event.inputs.youtubeKey }}
        AI_MODEL: ${{ github.event.inputs.aiModel }}
        AI_KEY: ${{ github.event.inputs.aiKey }}
